name: aastu_gibigubae_resource_app_frontend
description: "AASTU Freshman Resource App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local database (sqflite for downloads/cache)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Device info & fingerprinting
  device_info_plus: ^10.1.0

  # Connectivity
  connectivity_plus: ^6.1.0

  # Shared preferences (onboarding seen flag)
  shared_preferences: ^2.3.3

  # JSON serialization
  json_annotation: ^4.9.0

  # URL launcher (Telegram link)
  url_launcher: ^6.3.1

  # UUID for device fingerprint
  uuid: ^4.5.1

  # Crypto for checksum
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/premium/
